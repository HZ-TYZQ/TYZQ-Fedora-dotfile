# ~/.config/mpv/mpv.conf
# 机器：Ultra 9 275HX + RTX 5060 Laptop / 2560x1600 240Hz OLED / niri (Wayland)
# 查看任意选项的说明：man mpv，或在 mpv 里按 ` 打开控制台输入 help
# 查看当前生效的档位：mpv --show-profile=<名字>

##################
# 视频输出 / 解码 #
##################

vo=gpu-next
gpu-api=vulkan
# 优先零拷贝硬解（在本机会走 RTX 5060 的 Vulkan 解码），失败自动回退
hwdec=auto-safe

# 内置高画质预设：ewa_lanczossharp 放大 + 更好的 HDR 峰值检测
profile=high-quality
# 去色带，OLED 上暗部渐变的色带很明显
deband=yes
# 只对标记为隔行的视频做反交错
deinterlace=auto

# 让视频帧和 240Hz 刷新率对齐，消除抖动；oversample 在高刷屏上几乎不产生拖影
video-sync=display-resample
interpolation=yes
tscale=oversample

##########
# 窗口 #
##########

keep-open=yes
# 浮动窗口时不超过屏幕的 80%（平铺时由 niri 决定大小）
autofit-larger=80%x80%
cursor-autohide=1000
# 打开一个文件时，自动把同目录下同类型的文件加入播放列表
autocreate-playlist=same
# 不进入子文件夹（避免播完正片跑去放 SPs / CDs / Scans）
# 需要递归播放整个目录树时：mpv --directory-mode=recursive 文件夹
directory-mode=ignore

#############
# 记忆播放 #
#############

save-position-on-quit=yes
# 音量不跟着单个文件走，避免续播时音量忽大忽小
watch-later-options-remove=volume,mute
# 让 g-w（稍后观看）和 g-h（历史记录）菜单能显示文件名
write-filename-in-watch-later-config=yes
save-watch-history=yes

##########
# 音频 #
##########

volume=100
volume-max=150
# 自动加载同名外挂音轨（.mka 等）
audio-file-auto=fuzzy
# 想优先原声日语/英语音轨就取消注释
#alang=jpn,ja,eng,en

##########
# 字幕 #
##########

# 优先简体中文，其次繁体中文，再次英文；找不到也尽量显示一条字幕
slang=zh-Hans,zh-CN,chs,sc,zho,chi,zh,zh-Hant,zh-TW,zh-HK,cht,tc,eng,en
subs-fallback=yes
sub-auto=fuzzy
sub-file-paths=sub:subs:Subs:subtitles:Subtitles:字幕

# 以下样式只影响 SRT 等纯文本字幕；ASS 字幕保持字幕组原样式
sub-font="Noto Sans CJK SC"
# 字号跟随画面而不是窗口，平铺成窄长窗口时字幕不会变得过大（和 ASS 字幕行为一致）
sub-scale-with-window=no
sub-font-size=48
sub-color="#FFFFFF"
sub-outline-color="#000000"
sub-outline-size=2.5
sub-shadow-offset=1
sub-back-color="#80000000"
sub-margin-y=40

##############
# 界面 / OSD #
##############

# 控制栏和常用提示（音量、跳转、倍速、切轨……）由 scripts/mochi.lua 绘制，
# 样式在 script-opts/mochi.conf；这里关掉内置控制栏和跳转提示，避免重复
osc=no
osd-on-seek=no

# 其余内置提示的样式。配色取自 niri/noctalia 主题：暖白文字、深棕底、桃色强调
osd-font="Noto Sans CJK SC"
osd-font-size=30
osd-color="#F2E8E2"
# 提示文字放在半透明深棕底框里；底框颜色同时用作 g 菜单 / 控制台的背景
osd-border-style=background-box
osd-back-color="#B31A120D"
osd-outline-color="#1A120D"
# background-box 模式下，底框的内边距由 shadow-offset 决定；
# outline-size 仍是每个字的描边，设为 0 只留底框（同内置的 osd-box 档位）
osd-outline-size=0
osd-shadow-offset=6
osd-selected-color="#FFB787"
osd-margin-x=28
osd-margin-y=24
osd-duration=1200

# 进度 / 音量条：细一点
osd-bar-h=1.4
osd-bar-w=42
osd-bar-outline-size=0.4
osd-bar-marker-style=line

term-osd-bar=yes

########
# 截图 #
########

screenshot-dir=~/Pictures/mpv
# 末尾的 %#01n 是序号：同一帧连拍（s 和 S）时文件名不会撞车
screenshot-template="%F_%wH-%wM-%wS.%wT_%#01n"
screenshot-format=png
# 输出普通 8 位 PNG，兼容性更好、体积更小
screenshot-high-bit-depth=no

##################
# 缓存 / 网络流 #
##################

demuxer-max-bytes=512MiB
demuxer-max-back-bytes=128MiB
# 网络视频最高取到 1600p（与屏幕匹配），用 yt-dlp 解析
ytdl-format=bv*[height<=?1600]+ba/b[height<=?1600]/bv*+ba/b


##############
# 条件档位 #
##############

# 电池供电时自动启用，插电后自动恢复。电源状态由 scripts/powermode.lua 检测，
# Ctrl+b 可在 自动 / 强制省电 / 强制性能 之间切换
[battery]
profile-desc=省电模式：降低渲染开销
profile-cond=get("user-data/powermode/battery", false)
profile-restore=copy-equal
scale=spline36
deband=no
interpolation=no
video-sync=audio
hdr-compute-peak=no

# 看图：一直停在当前图片，用 < > 翻页；Ctrl+滚轮缩放，Alt+方向键平移
# 不要在这里改 video-sync / interpolation / deband：和 [battery] 改同一个选项时，
# 两个档位各自恢复会互相覆盖（看图时拔电再切回视频，省电设置会失效）
[image]
profile-desc=图片浏览
profile-cond=get("current-tracks/video/image", false) and not get("current-tracks/video/albumart", false)
profile-restore=copy-equal
image-display-duration=inf

# 听歌：有封面时控制栏常驻
[audio]
profile-desc=音乐
profile-cond=get("current-tracks/audio", nil) and (not get("current-tracks/video", nil) or get("current-tracks/video/albumart", false))
profile-restore=copy-equal
script-opts-append=mochi-visibility=always

[extension.gif]
loop-file=inf

# 网络链接解析较慢，先把窗口开出来
[protocol.https]
force-window=immediate

[protocol.http]
force-window=immediate
