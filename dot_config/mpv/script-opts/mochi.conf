# mochi.lua 的设置（圆润风格控制栏 / 提示气泡）
# 改完重开 mpv 生效；颜色格式 #RRGGBB

# 控制栏显示方式：auto 鼠标移到底部时出现 / always 常驻 / never 不显示（DEL 键可切换）
visibility=auto
# auto 时的触发区：鼠标进入窗口底部这么高的范围才弹出控制栏，移出就收起
# 以 1080p 窗口为基准、随窗口缩放（控制栏本身约占底部 124）；0 = 在任意位置移动鼠标都弹出
trigger_height=200
# 鼠标停下多少秒后隐藏（停在控制栏上时一直显示）
hide_timeout=1.2
# 整体缩放，觉得大或小就调这个
scale=1

# 配色（与 niri/noctalia 主题一致）
accent=#FFB787
foreground=#F2E8E2
background=#1A120D
# 面板不透明度 0~1
opacity=0.85

# 暂停 / 继续时画面中央的圆形动画
pause_flash=yes
# 控制栏出现时把字幕往上挪
avoid_subtitles=yes
