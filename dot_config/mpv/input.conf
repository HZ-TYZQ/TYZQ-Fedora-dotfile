# ~/.config/mpv/input.conf
# 这里只放改动和新增的按键，其余沿用 mpv 默认（完整默认表：/usr/share/doc/mpv/input.conf）
# 在 mpv 里按 ? 可以查看当前所有按键绑定
#
# 带 no-osd 的命令：关掉 mpv 内置的方框提示，改由 mochi 显示圆角气泡

# ---- 音量：↑↓ / 滚轮 / 9 0 ----
UP          no-osd add volume 5
DOWN        no-osd add volume -5
WHEEL_UP    no-osd add volume 2
WHEEL_DOWN  no-osd add volume -2
9           no-osd add volume -2
0           no-osd add volume 2
/           no-osd add volume -2
*           no-osd add volume 2
KP_DIVIDE   no-osd add volume -2
KP_MULTIPLY no-osd add volume 2
VOLUME_UP   no-osd add volume 2
VOLUME_DOWN no-osd add volume -2
m           no-osd cycle mute
MUTE        no-osd cycle mute

# ---- 进度：←→ 5 秒，Shift+←→ 60 秒（跳转提示由 mochi 显示）----
Shift+RIGHT seek 60
Shift+LEFT  seek -60
PGUP        no-osd add chapter 1
PGDWN       no-osd add chapter -1
!           no-osd add chapter -1
@           no-osd add chapter 1

# ---- 倍速：每次 ±0.1，{ } 减半 / 翻倍，Backspace 恢复 ----
[           no-osd add speed -0.1
]           no-osd add speed 0.1
{           no-osd multiply speed 0.5
}           no-osd multiply speed 2.0
BS          no-osd set speed 1.0

# ---- 字幕 / 音轨 ----
j           no-osd cycle sub
J           no-osd cycle sub down
SHARP       no-osd cycle audio
z           no-osd add sub-delay -0.1
Z           no-osd add sub-delay +0.1
x           no-osd add sub-delay +0.1
Ctrl++      no-osd add audio-delay 0.100
Ctrl+-      no-osd add audio-delay -0.100

# ---- 界面 ----
MBTN_MID    script-binding select/menu                      # 中键 / Ctrl+p 打开菜单
DEL         script-binding mochi/cycle-visibility           # 控制栏：自动隐藏 / 常驻 / 隐藏

# ---- 画面 ----
Ctrl+r      no-osd cycle-values video-rotate 90 180 270 0; script-message-to mochi toast "旋转 ${video-rotate}°" rotate
Ctrl+h      no-osd cycle-values hwdec "auto-safe" "no"; script-message-to mochi toast "${?hwdec==no:软件解码}${!hwdec==no:硬件解码}" memory
Ctrl+b      script-binding powermode/cycle                  # 电源模式：自动 / 强制省电 / 强制性能

# ---- 声音 ----
# 夜间模式：动态音量压缩，对白变响、爆炸声变小
n           af toggle @night:dynaudnorm=f=150:g=15; script-message-to mochi toast "夜间模式：${?af==(empty):关闭}${!af==(empty):开启}" night


# ================= 常用默认按键速查（无需配置，已经生效） =================
# SPACE / 右键      暂停              双击 / f        全屏
# ← →               后退 / 前进 5 秒   Shift+↑ ↓       精确 ±5 秒
# Ctrl+← →          上 / 下一句字幕    PgUp / PgDn     下 / 上一章节
# , .               逐帧后退 / 前进    l               A-B 循环（按两次设定区间）
# < > / Enter       上 / 下一个文件    L               单个文件循环
# { }               速度减半 / 翻倍    BS              恢复 1 倍速
# 9 0 / 滚轮        音量               m               静音
# z x               字幕提前 / 延后    j J             切换字幕
# r R               字幕上移 / 下移    F G             字幕缩小 / 放大
# v                 显示 / 隐藏字幕    #               切换音轨
# s                 截图（带字幕）     S               截图（不带字幕）
# i / I             播放信息 / 常驻    ?               按键列表
# Ctrl+v            把剪贴板里的链接 / 路径加入播放列表（空闲时直接播放）
# Ctrl+滚轮         以鼠标为中心缩放   Alt+BS          重置缩放平移
# b                 开关去色带         d               开关反交错
# Shift+q           退出并记住进度（已设为退出时自动记住）
# g 系列菜单：g-p 播放列表  g-s 字幕  g-a 音轨  g-c 章节  g-h 历史  g-w 稍后观看
# `                 控制台
#
# 控制栏上：点时间切换 剩余时间；右键字幕 / 音轨按钮弹出选择菜单；
#           点标题打开播放列表，右键标题打开历史记录；在进度条上滚轮快进快退
