# l / Enter：目录 → 进入；文件 → 按 [open] 规则打开
[[mgr.prepend_keymap]]
on   = "l"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "<Right>"
run  = "plugin xdg-enter"
desc = "Enter the child directory, or open the file with xdg-open"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

# y / x：yank 并同步到系统剪贴板（fedora-clipboard 插件）
[[mgr.prepend_keymap]]
on   = "y"
run  = [ "yank", "plugin fedora-clipboard push" ]
desc = "Yank selected files (copy) and sync to the system clipboard"

[[mgr.prepend_keymap]]
on   = "x"
run  = [ "yank --cut", "plugin fedora-clipboard push" ]
desc = "Yank selected files (cut) and sync to the system clipboard"

# p / P：从系统剪贴板或 yazi 的 yank 粘贴（fedora-clipboard 插件）
[[mgr.prepend_keymap]]
on   = "p"
run  = "plugin fedora-clipboard paste"
desc = "Paste from the system clipboard or yanked files"

[[mgr.prepend_keymap]]
on   = "P"
run  = "plugin fedora-clipboard 'paste --force'"
desc = "Paste from the system clipboard or yanked files (overwrite)"
