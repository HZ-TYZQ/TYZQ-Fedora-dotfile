# vim:ft=kitty
## name:   Oolong Dark
## blurb:  乌龙·夜 — 暖调低蓝光护眼深色主题
#
# 设计要点（OKLCH 色彩空间推导，对比度为 WCAG 比值）：
#   · 背景是带茶色的暖深灰，不用纯黑，减少亮字在黑底上的光晕和瞳孔疲劳
#   · 正文为米白，不用纯白；对比度 11.4:1，清晰又不刺眼
#   · 6 个强调色明度一致（OKLCH L≈0.74）、饱和度低，没有哪个颜色"跳"出来
#   · 强调色对背景均 ≥ 6.7:1，注释灰 4.8:1；选区不改文字色，语法高亮在选区上仍 ≥ 4.4:1

# ── 基础 ─────────────────────────────────────────────
background              #1e1b16
foreground              #dad2c1
selection_background    #2f3d32
selection_foreground    none
url_color               #83b2ce

# ── 光标 ─────────────────────────────────────────────
cursor                  #e9ce94
cursor_text_color       #1e1b16

# ── 边框 / 滚动条 ────────────────────────────────────
active_border_color     #9bbd8a
inactive_border_color   #343028
bell_border_color       #dca476
scrollbar_handle_color  #8d877a
scrollbar_track_color   #28251f

# ── 标签栏 ───────────────────────────────────────────
tab_bar_background      #171510
active_tab_foreground   #1e1b16
active_tab_background   #9bbd8a
inactive_tab_foreground #aaa497
inactive_tab_background #28251f

# ── 标记（kitty marks）──────────────────────────────
mark1_foreground #1e1b16
mark1_background #9bbd8a
mark2_foreground #1e1b16
mark2_background #e9ce94
mark3_foreground #1e1b16
mark3_background #83b2ce

# ── 16 色 ────────────────────────────────────────────
# 黑
color0  #343028
color8  #8d877a
# 红（陶土）
color1  #d59087
color9  #eca69c
# 绿（鼠尾草）
color2  #9bbd8a
color10 #b1d49f
# 黄（麦秆）
color3  #d7ba7d
color11 #e9ce94
# 蓝（雾蓝）
color4  #83b2ce
color12 #98c8e5
# 品红（藕荷）
color5  #c697b6
color13 #ddadcc
# 青（青瓷）
color6  #81bfb6
color14 #97d6cd
# 白
color7  #c1baab
color15 #eee7d9
